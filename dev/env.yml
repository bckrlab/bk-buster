name: dev
channels:
  - conda-forge
  - defaults
  - pytorch
  - nvidia
dependencies:
  - python=3.12
  - ipykernel
  - ipywidgets
  - numpy
  - scipy
  - pandas
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - rich
  - more-itertools
  - networkx
  - rapidsai::nx-cugraph
  - pygraphviz
  - gpustat
  - pytorch::pytorch=2.5.0
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::pytorch-cuda=12.1
  - pip:
    - torch_geometric
    - pyhere
    - --find-links https://data.pyg.org/whl/torch-2.5.0+cu121.html
    - torch-scatter
    - torch-sparse